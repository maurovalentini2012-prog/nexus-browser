<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Nexus Browser</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="switcher.css">
<link rel="stylesheet" href="overlays.css">
</head>
<body>
  <!-- Riga 1: schede (trascinabile per spostare la finestra) -->
  <div class="strip" id="strip">
    <button class="proj" id="projBtn" title="Cambia progetto (Ctrl/Cmd+Shift+P)" aria-label="Cambia progetto">
      <span class="proj-dot" id="projDot"></span><span class="proj-name" id="projName">Generale</span>
      <svg viewBox="0 0 10 10" width="9" height="9" aria-hidden="true"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="tabs" id="tabs"></div>
    <button class="newtab" id="newtab" title="Nuova scheda (Ctrl/Cmd+T)" aria-label="Nuova scheda">
      <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>

  <!-- Riga 2: barra strumenti -->
  <div class="toolbar" id="toolbar">
    <button class="tb" id="back" title="Indietro" aria-label="Indietro">
      <svg viewBox="0 0 16 16" width="16" height="16"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="tb" id="forward" title="Avanti" aria-label="Avanti">
      <svg viewBox="0 0 16 16" width="16" height="16"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="tb" id="reload" title="Ricarica" aria-label="Ricarica"></button>
    <button class="tb" id="home" title="Home Nexus" aria-label="Home Nexus">
      <svg viewBox="0 0 16 16" width="16" height="16"><path d="M8 1.6l5.6 3.2v6.4L8 14.4l-5.6-3.2V4.8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M5.8 10.6V5.4h.9l2.6 3.7V5.4h.9v5.2h-.9L6.7 6.9v3.7z" fill="currentColor"/></svg>
    </button>

    <form class="omni" id="omniForm" autocomplete="off">
      <svg class="omni-ic" viewBox="0 0 16 16" width="14" height="14"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input id="omni" type="text" spellcheck="false" placeholder="Cerca o digita un indirizzo" aria-label="Barra indirizzi">
      <button class="star" id="addlink" type="button" title="Aggiungi ai preferiti (Ctrl/Cmd+D)" aria-label="Aggiungi ai preferiti">
        <svg viewBox="0 0 16 16" width="15" height="15"><path d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.5l-3.8 2.1.7-4.3-3.1-3 4.3-.6z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
      </button>
    </form>

    <button class="tb" id="askBtn" title="Chiedi a Nexus (Ctrl/Cmd+Shift+K)" aria-label="Chiedi a Nexus">
      <svg viewBox="0 0 16 16" width="16" height="16"><path d="M8 1.5l1.3 3.6 3.6 1.3-3.6 1.3L8 11.3 6.7 7.7 3.1 6.4l3.6-1.3z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M12.6 10.6l.6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6-1.6-.6 1.6-.6z" fill="currentColor"/></svg>
    </button>
    <button class="tb" id="favBtn" title="Preferiti (Ctrl/Cmd+Shift+O)" aria-label="Preferiti">
      <svg viewBox="0 0 16 16" width="16" height="16"><path d="M3.6 1.9h8.8v12.2L8 11.3l-4.4 2.8z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
    </button>
    <button class="tb" id="tabs3d" title="Schede in 3D (Ctrl+Tab)" aria-label="Schede in 3D">
      <svg viewBox="0 0 16 16" width="17" height="17"><rect x="4.2" y="2" width="7.6" height="9" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.3" opacity=".55"/><rect x="2" y="4.4" width="7.6" height="9" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.3" opacity=".8"/><rect x="6.4" y="5.4" width="7.6" height="9" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>

    <button class="tb" id="fsBtn" title="Schermo intero (F11)" aria-label="Schermo intero">
      <svg class="fs-in" viewBox="0 0 16 16" width="16" height="16"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="fs-out" viewBox="0 0 16 16" width="16" height="16"><path d="M6 2v4H2M14 6h-4V2M10 14v-4h4M2 10h4v4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <button class="tb" id="shieldBtn" title="Blocco pubblicità e tracker" aria-label="Blocco pubblicità e tracker">
      <svg viewBox="0 0 16 16" width="16" height="16"><path d="M8 1.6l5 1.9v4.1c0 3-2.1 5.2-5 6.8-2.9-1.6-5-3.8-5-6.8V3.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path class="sh-ok" d="M5.8 8l1.7 1.7L10.4 6.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path class="sh-off" d="M3 13L13 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span class="badge" id="shieldN" hidden>0</span>
    </button>

    <button class="tb" id="dlBtn" title="Download (Ctrl/Cmd+J)" aria-label="Download">
      <svg viewBox="0 0 16 16" width="16" height="16"><path d="M8 2v8M4.6 7L8 10.4 11.4 7M3 13.2h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="dl-bar" aria-hidden="true"></span>
    </button>
    <button class="tb" id="setBtn" title="Impostazioni (Ctrl/Cmd+,)" aria-label="Impostazioni">
      <svg viewBox="0 0 16 16" width="16" height="16"><circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.6v1.7M8 12.7v1.7M1.6 8h1.7M12.7 8h1.7M3.5 3.5l1.2 1.2M11.3 11.3l1.2 1.2M12.5 3.5l-1.2 1.2M4.7 11.3l-1.2 1.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>

    <button class="kbtn" id="palBtn" title="Barra comandi" aria-label="Barra comandi"><span id="palKey">Ctrl K</span></button>

    <label class="engine" title="Motore di ricerca">
      <span class="engine-lbl">Motore</span>
      <select id="engine" aria-label="Motore di ricerca"></select>
    </label>

    <div class="themes" id="themes" role="radiogroup" aria-label="Colore"></div>

    <!-- SLOT FUNZIONI: qui andranno i tuoi pulsanti personalizzati.
         Esempio: <button class="tb" id="mio-pulsante" title="La mia funzione">…</button>
         poi in shell.js: document.getElementById('mio-pulsante').onclick = () => { … } -->
    <div class="slot" id="slot"></div>
    <div class="sweep" aria-hidden="true"></div>
  </div>

  <!-- Trova nella pagina -->
  <div class="findbar" id="findbar" hidden role="search">
    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <input id="findInput" type="text" spellcheck="false" autocomplete="off" placeholder="Trova nella pagina" aria-label="Trova nella pagina">
    <span class="find-count" id="findCount" aria-live="polite"></span>
    <button class="tb" id="findPrev" type="button" title="Precedente (Maiusc+Invio)" aria-label="Risultato precedente"><svg viewBox="0 0 16 16" width="15" height="15"><path d="M3.5 10L8 5.5l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="tb" id="findNext" type="button" title="Successivo (Invio)" aria-label="Risultato successivo"><svg viewBox="0 0 16 16" width="15" height="15"><path d="M3.5 6L8 10.5 12.5 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="tb" id="findClose" type="button" title="Chiudi (Esc)" aria-label="Chiudi la ricerca"><svg viewBox="0 0 16 16" width="13" height="13"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
  </div>

  <!-- Cambio scheda 3D (compare sopra l'area della pagina) -->
  <div class="sw3d" id="sw3d" hidden aria-label="Cambio scheda">
    <div class="sw-bg"></div>
    <div class="sw-stars" aria-hidden="true"></div>
    <div class="sw-stage" id="swStage">
      <div class="sw-tilt" id="swTilt"><div class="sw-ring" id="swRing"></div></div>
    </div>
    <div class="sw-info"><div class="sw-title" id="swTitle"></div><div class="sw-url" id="swUrl"></div></div>
    <div class="sw-hint"><span><kbd>←</kbd><kbd>→</kbd> o <kbd>Tab</kbd> scorri</span><span><kbd>Invio</kbd> apri</span><span><kbd>Esc</kbd> annulla</span><span>rotella del mouse per girare</span></div>
  </div>

  <!-- Pianeti: scegli il progetto -->
  <div class="spc" id="spc" hidden aria-label="Progetti">
    <div class="sw-bg"></div>
    <div class="sw-stars" aria-hidden="true"></div>
    <div class="spc-orbit" id="spcOrbit" aria-hidden="true"></div>
    <div class="spc-core" id="spcCore" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="64" height="64"><path d="M32 4l24 14v28L32 60 8 46V18z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M23 44V20h4l11 16V20h4v24h-4L27 28v16z" fill="currentColor"/></svg>
    </div>
    <div class="spc-planets" id="spcPlanets"></div>
    <div class="spc-info" id="spcInfo">
      <div class="spc-name" id="spcName"></div>
      <input class="spc-rename" id="spcRenameInput" maxlength="30" hidden aria-label="Nome del progetto">
      <div class="spc-meta" id="spcMeta"></div>
      <div class="spc-actions" id="spcActions">
        <button class="spc-btn primary" id="spcEnter" type="button">Entra</button>
        <button class="spc-btn" id="spcRename" type="button">Rinomina</button>
        <button class="spc-btn danger" id="spcDelete" type="button">Elimina</button>
      </div>
      <form class="spc-new" id="spcNew" hidden>
        <input id="spcNewName" maxlength="30" placeholder="Nome del nuovo progetto" aria-label="Nome del nuovo progetto" autocomplete="off">
        <button class="spc-btn primary" type="submit">Crea progetto</button>
      </form>
    </div>
    <div class="sw-hint"><span><kbd>←</kbd><kbd>→</kbd> scegli</span><span><kbd>Invio</kbd> entra</span><span><kbd>Esc</kbd> chiudi</span></div>
  </div>

  <!-- Barra comandi -->
  <div class="pal" id="pal" hidden aria-label="Barra comandi">
    <div class="pal-shot" id="palShot"></div>
    <div class="pal-dim"></div>
    <div class="pal-card" role="dialog" aria-modal="true" aria-label="Barra comandi">
      <div class="pal-in">
        <svg class="pal-hex" viewBox="0 0 16 16" width="20" height="20" aria-hidden="true"><path d="M8 1.2l6 3.4v6.8L8 14.8 2 11.4V4.6z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M5.7 10.8V5.2h1l2.7 4V5.2h1v5.6h-1l-2.7-4v4z" fill="currentColor"/></svg>
        <input id="palInput" type="text" spellcheck="false" autocomplete="off" placeholder="Cerca schede, progetti, link e comandi" aria-label="Cerca">
      </div>
      <div class="pal-list" id="palList" role="listbox"></div>
      <div class="pal-foot" id="palFoot"></div>
    </div>
  </div>

  <!-- Download -->
  <div class="dlp" id="dlp" hidden aria-label="Download">
    <div class="pal-shot" id="dlShot"></div>
    <div class="pal-dim"></div>
    <div class="dlp-card" role="dialog" aria-modal="true" aria-label="Download">
      <div class="dlp-head"><b>Download</b><button class="spc-btn" id="dlClear" type="button">Svuota elenco</button></div>
      <div class="dlp-list" id="dlList"></div>
      <div class="pal-foot" id="dlFoot"></div>
    </div>
  </div>

  <!-- Preferiti -->
  <div class="dlp fvp" id="fvp" hidden aria-label="Preferiti">
    <div class="pal-shot" id="fvShot"></div>
    <div class="pal-dim"></div>
    <div class="dlp-card fv-card" role="dialog" aria-modal="true" aria-label="Preferiti">
      <div class="dlp-head"><b>Preferiti <small id="fvSpace"></small></b><button class="spc-btn" id="fvClose" type="button">Chiudi</button></div>
      <div class="fv-main">
        <nav class="fv-side" id="fvSide" aria-label="Cartelle"></nav>
        <div class="fv-content">
          <div class="fv-tools">
            <input id="fvSearch" type="search" placeholder="Cerca nei preferiti" aria-label="Cerca nei preferiti" autocomplete="off">
            <button class="spc-btn" id="fvImport" type="button" title="Da Chrome, Safari o Firefox (file HTML)">Importa</button>
            <button class="spc-btn" id="fvAddCur" type="button" title="Salva la pagina aperta">Aggiungi pagina</button>
          </div>
          <form class="fv-add" id="fvAddForm" autocomplete="off">
            <input id="fvAddTitle" type="text" placeholder="Nome (facoltativo)" maxlength="60" aria-label="Nome del preferito">
            <input id="fvAddUrl" type="text" placeholder="Indirizzo (es. drive.google.com)" aria-label="Indirizzo del preferito" required>
            <button class="spc-btn primary" type="submit">Salva</button>
          </form>
          <div class="fv-head" id="fvHead"></div>
          <div class="dlp-list fv-list" id="fvList"></div>
        </div>
      </div>
      <div class="pal-foot" id="fvFoot"></div>
    </div>
  </div>

  <!-- Cronologia -->
  <div class="dlp fvp" id="hip" hidden aria-label="Cronologia">
    <div class="pal-shot" id="hiShot"></div>
    <div class="pal-dim"></div>
    <div class="dlp-card fv-card hi-card" role="dialog" aria-modal="true" aria-label="Cronologia">
      <div class="dlp-head"><b>Cronologia</b><div class="hi-act"><button class="spc-btn" id="hiClear" type="button">Cancella tutto</button><button class="spc-btn" id="hiClose" type="button">Chiudi</button></div></div>
      <div class="hi-top"><input id="hiSearch" type="search" placeholder="Cerca per nome o indirizzo" aria-label="Cerca nella cronologia" autocomplete="off"></div>
      <div class="dlp-list fv-list hi-list" id="hiList"></div>
      <div class="pal-foot" id="hiFoot"></div>
    </div>
  </div>

  <!-- ZIP -->
  <div class="dlp zpp" id="zpp" hidden aria-label="Archivi ZIP">
    <div class="pal-shot" id="zpShot"></div>
    <div class="pal-dim"></div>
    <div class="dlp-card zp-card" role="dialog" aria-modal="true" aria-label="Archivi ZIP">
      <div class="dlp-head"><b>ZIP</b>
        <div class="zp-tabs" role="tablist"><button type="button" id="zpTabView" role="tab">Apri ed estrai</button><button type="button" id="zpTabCreate" role="tab">Crea archivio</button></div>
        <button class="spc-btn" id="zpClose" type="button">Chiudi</button></div>
      <div class="zp-body" id="zpBody"></div>
      <div class="zp-msg" id="zpMsg" role="status"></div>
      <div class="pal-foot" id="zpFoot"></div>
    </div>
  </div>

  <!-- Impostazioni -->
  <div class="dlp stp" id="stp" hidden aria-label="Impostazioni">
    <div class="pal-shot" id="stShot"></div>
    <div class="pal-dim"></div>
    <div class="dlp-card stp-card" role="dialog" aria-modal="true" aria-label="Impostazioni">
      <div class="dlp-head"><b>Impostazioni</b><button class="spc-btn" id="stClose" type="button">Chiudi</button></div>
      <div class="dlp-list st-body" id="stBody"></div>
      <div class="pal-foot" id="stFoot"></div>
    </div>
  </div>

  <script src="../shared/themes.js"></script>
  <script src="shell.js"></script>
  <script src="switcher.js"></script>
  <script src="spaces.js"></script>
  <script src="palette.js"></script>
  <script src="tools.js"></script>
  <script src="settings.js"></script>
  <script src="favorites.js"></script>
  <script src="zip.js"></script>
  <script src="history.js"></script>
</body>
</html>
