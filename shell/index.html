<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Nexus Browser</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="switcher.css">
<link rel="stylesheet" href="overlays.css">
</head>
<body>
  <!-- Riga 1: schede (trascinabile per spostare la finestra) -->
  <div class="strip" id="strip">
    <button class="proj" id="projBtn" title="Cambia progetto (Ctrl/Cmd+Shift+P)" aria-label="Cambia progetto">
      <span class="proj-dot" id="projDot"></span><span class="proj-name" id="projName">Generale</span>
      <svg viewBox="0 0 10 10" width="9" height="9" aria-hidden="true"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="tabs" id="tabs"></div>
    <button class="newtab" id="newtab" title="Nuova scheda (Ctrl/Cmd+T)" aria-label="Nuova scheda">
      <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>

  <!-- Riga 2: barra strumenti -->
  <div class="toolbar" id="toolbar">
    <button class="tb" id="back" title="Indietro" aria-label="Indietro">
      <svg viewBox="0 0 16 16" width="16" height="16"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="tb" id="forward" title="Avanti" aria-label="Avanti">
      <svg viewBox="0 0 16 16" width="16" height="16"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="tb" id="reload" title="Ricarica" aria-label="Ricarica"></button>
    <button class="tb" id="home" title="Home Nexus" aria-label="Home Nexus">
      <svg viewBox="0 0 16 16" width="16" height="16"><path d="M8 1.6l5.6 3.2v6.4L8 14.4l-5.6-3.2V4.8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M5.8 10.6V5.4h.9l2.6 3.7V5.4h.9v5.2h-.9L6.7 6.9v3.7z" fill="currentColor"/></svg>
    </button>

    <form class="omni" id="omniForm" autocomplete="off">
      <svg class="omni-ic" viewBox="0 0 16 16" width="14" height="14"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input id="omni" type="text" spellcheck="false" placeholder="Cerca o digita un indirizzo" aria-label="Barra indirizzi">
      <button class="star" id="addlink" type="button" title="Aggiungi ai link della home (Ctrl/Cmd+D)" aria-label="Aggiungi ai link della home">
        <svg viewBox="0 0 16 16" width="15" height="15"><path d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.5l-3.8 2.1.7-4.3-3.1-3 4.3-.6z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
      </button>
    </form>

    <button class="tb" id="tabs3d" title="Schede in 3D (Ctrl+Tab)" aria-label="Schede in 3D">
      <svg viewBox="0 0 16 16" width="17" height="17"><rect x="4.2" y="2" width="7.6" height="9" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.3" opacity=".55"/><rect x="2" y="4.4" width="7.6" height="9" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.3" opacity=".8"/><rect x="6.4" y="5.4" width="7.6" height="9" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>

    <button class="kbtn" id="palBtn" title="Barra comandi" aria-label="Barra comandi"><span id="palKey">Ctrl K</span></button>

    <label class="engine" title="Motore di ricerca">
      <span class="engine-lbl">Motore</span>
      <select id="engine" aria-label="Motore di ricerca"></select>
    </label>

    <div class="themes" id="themes" role="radiogroup" aria-label="Colore"></div>

    <!-- SLOT FUNZIONI: qui andranno i tuoi pulsanti personalizzati.
         Esempio: <button class="tb" id="mio-pulsante" title="La mia funzione">…</button>
         poi in shell.js: document.getElementById('mio-pulsante').onclick = () => { … } -->
    <div class="slot" id="slot"></div>
    <div class="sweep" aria-hidden="true"></div>
  </div>

  <!-- Cambio scheda 3D (compare sopra l'area della pagina) -->
  <div class="sw3d" id="sw3d" hidden aria-label="Cambio scheda">
    <div class="sw-bg"></div>
    <div class="sw-stars" aria-hidden="true"></div>
    <div class="sw-stage" id="swStage">
      <div class="sw-tilt" id="swTilt"><div class="sw-ring" id="swRing"></div></div>
    </div>
    <div class="sw-info"><div class="sw-title" id="swTitle"></div><div class="sw-url" id="swUrl"></div></div>
    <div class="sw-hint"><span><kbd>←</kbd><kbd>→</kbd> o <kbd>Tab</kbd> scorri</span><span><kbd>Invio</kbd> apri</span><span><kbd>Esc</kbd> annulla</span><span>rotella del mouse per girare</span></div>
  </div>

  <!-- Pianeti: scegli il progetto -->
  <div class="spc" id="spc" hidden aria-label="Progetti">
    <div class="sw-bg"></div>
    <div class="sw-stars" aria-hidden="true"></div>
    <div class="spc-orbit" id="spcOrbit" aria-hidden="true"></div>
    <div class="spc-core" id="spcCore" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="64" height="64"><path d="M32 4l24 14v28L32 60 8 46V18z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M23 44V20h4l11 16V20h4v24h-4L27 28v16z" fill="currentColor"/></svg>
    </div>
    <div class="spc-planets" id="spcPlanets"></div>
    <div class="spc-info" id="spcInfo">
      <div class="spc-name" id="spcName"></div>
      <input class="spc-rename" id="spcRenameInput" maxlength="30" hidden aria-label="Nome del progetto">
      <div class="spc-meta" id="spcMeta"></div>
      <div class="spc-actions" id="spcActions">
        <button class="spc-btn primary" id="spcEnter" type="button">Entra</button>
        <button class="spc-btn" id="spcRename" type="button">Rinomina</button>
        <button class="spc-btn danger" id="spcDelete" type="button">Elimina</button>
      </div>
      <form class="spc-new" id="spcNew" hidden>
        <input id="spcNewName" maxlength="30" placeholder="Nome del nuovo progetto" aria-label="Nome del nuovo progetto" autocomplete="off">
        <button class="spc-btn primary" type="submit">Crea progetto</button>
      </form>
    </div>
    <div class="sw-hint"><span><kbd>←</kbd><kbd>→</kbd> scegli</span><span><kbd>Invio</kbd> entra</span><span><kbd>Esc</kbd> chiudi</span></div>
  </div>

  <!-- Barra comandi -->
  <div class="pal" id="pal" hidden aria-label="Barra comandi">
    <div class="pal-shot" id="palShot"></div>
    <div class="pal-dim"></div>
    <div class="pal-card" role="dialog" aria-modal="true" aria-label="Barra comandi">
      <div class="pal-in">
        <svg class="pal-hex" viewBox="0 0 16 16" width="20" height="20" aria-hidden="true"><path d="M8 1.2l6 3.4v6.8L8 14.8 2 11.4V4.6z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M5.7 10.8V5.2h1l2.7 4V5.2h1v5.6h-1l-2.7-4v4z" fill="currentColor"/></svg>
        <input id="palInput" type="text" spellcheck="false" autocomplete="off" placeholder="Cerca schede, progetti, link e comandi" aria-label="Cerca">
      </div>
      <div class="pal-list" id="palList" role="listbox"></div>
      <div class="pal-foot" id="palFoot"></div>
    </div>
  </div>

  <script src="../shared/themes.js"></script>
  <script src="shell.js"></script>
  <script src="switcher.js"></script>
  <script src="spaces.js"></script>
  <script src="palette.js"></script>
</body>
</html>
