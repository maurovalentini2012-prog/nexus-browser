# Costruisce gli installer (Mac .dmg e Windows .exe) e pubblica la release ogni volta che crei un tag.
#   Versione normale:  git tag v0.3.0        && git push origin v0.3.0
#   Versione beta:     git tag v0.3.0-beta.1 && git push origin v0.3.0-beta.1   (segnata come pre-release)
name: Release
on:
  push:
    tags: ['v*']
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - name: Versione dal tag
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
      # un'architettura alla volta: i due .dmg hanno lo stesso nome di volume e in parallelo si bloccano a vicenda
      - run: npx electron-builder --mac dmg zip --x64 --publish never
      - run: npx electron-builder --mac dmg zip --arm64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            dist/*.dmg
            dist/*.zip
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - name: Versione dal tag
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
      - run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
  release:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          PRE=""
          case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/* --generate-notes --title "Nexus Browser $GITHUB_REF_NAME" $PRE
          fi
